spring:
  application:
    name: CertChain Backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/certchain}
    username: ${DATABASE_USERNAME:certchain}
    password: ${DATABASE_PASSWORD:certchain-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    issuer: ${JWT_ISSUER:certchain}
    secret-base64: ${JWT_SECRET_BASE64:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cookie-name: ${AUTH_COOKIE_NAME:CERTCHAIN_AUTH}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  bootstrap:
    enabled: ${DEV_BOOTSTRAP_ENABLED:false}
    organization-name: ${DEV_ORGANIZATION_NAME:}
    organization-email: ${DEV_ORGANIZATION_EMAIL:}
    admin-name: ${DEV_ADMIN_NAME:}
    admin-email: ${DEV_ADMIN_EMAIL:}
    admin-password: ${DEV_ADMIN_PASSWORD:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    type: ${STORAGE_TYPE:local}
    root: ${STORAGE_ROOT:./storage}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      region: ${STORAGE_S3_REGION:}
      bucket: ${STORAGE_S3_BUCKET:}
      access-key-id: ${STORAGE_S3_ACCESS_KEY_ID:}
      secret-access-key: ${STORAGE_S3_SECRET_ACCESS_KEY:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:certificates@certchain.local}
    retry-poll-ms: ${MAIL_RETRY_POLL_MS:60000}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}
    network: ${BLOCKCHAIN_NETWORK:sepolia}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}
    rpc-url: ${BLOCKCHAIN_RPC_URL:}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
    issuer-private-key: ${BLOCKCHAIN_ISSUER_PRIVATE_KEY:}
    confirmations: ${BLOCKCHAIN_CONFIRMATIONS:2}
    deployment-block: ${BLOCKCHAIN_DEPLOYMENT_BLOCK:0}
    receipt-timeout: ${BLOCKCHAIN_RECEIPT_TIMEOUT:PT30S}

logging:
  level:
    root: INFO
    com.certchain: INFO
